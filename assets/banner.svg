<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0b0d18">
<animate attributeName="stop-color" values="#0b0d18;#181330;#0b0d18" dur="18s" repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#2b1959"/>
</linearGradient>

<linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7b5cff00"/>
<stop offset="50%" stop-color="#b38cff"/>
<stop offset="100%" stop-color="#7b5cff00"/>
</linearGradient>

<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
<path d="M36 0H0V36" stroke="#ffffff08" fill="none"/>
</pattern>

<filter id="glow">
<feGaussianBlur stdDeviation="2"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<rect width="1500" height="500" fill="url(#bg)"/>
<rect width="1500" height="500" fill="url(#grid)"/>

