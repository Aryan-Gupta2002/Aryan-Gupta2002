<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0b0d18">
<animate attributeName="stop-color" values="#0b0d18;#181330;#0b0d18" dur="18s" repeatCount="indefinite"/>
</stop>
<stop offset="100%" stop-color="#2b1959"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
<path d="M36 0H0V36" stroke="#ffffff08" fill="none"/>
</pattern>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#ffffff00"/>
<stop offset="50%" stop-color="#c8b8ff55"/>
<stop offset="100%" stop-color="#ffffff00"/>
</linearGradient>
</defs>

<rect width="1500" height="500" fill="url(#bg)"/>
<rect width="1500" height="500" fill="url(#grid)"/>

