<!-- animated title -->
<g opacity="0">
<animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate"
values="-20 0;0 0" dur="2s" fill="freeze"/>

<text x="90" y="125"
font-family="Segoe UI, Inter, sans-serif"
font-size="28"
letter-spacing="4"
fill="#A58BFF">
HI THERE,
</text>

<text x="90" y="195"
font-family="Segoe UI, Inter, sans-serif"
font-size="64"
font-weight="700"
fill="white">
I'm Aryan
</text>

<text x="90" y="235"
font-family="JetBrains Mono, monospace"
font-size="22"
fill="#D8CBFF">
Full-Stack Developer  •  ML / Deep Learning Enthusiast
</text>

<!-- blinking cursor -->
<rect x="470" y="160" width="4" height="45" fill="#A58BFF">
<animate attributeName="opacity"
values="1;0;1"
dur="1s"
repeatCount="indefinite"/>
</rect>
</g>

<!-- moving highlight -->
<rect x="-350" y="70" width="280" height="190" fill="url(#scan)" opacity=".18">
<animate attributeName="x" values="-350;900" dur="5s" begin="1.5s" repeatCount="indefinite"/>
</rect>

<!-- HUD -->
<g transform="translate(1080 215)" filter="url(#glow)">
<animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="120s" repeatCount="indefinite"/>
<circle r="95" fill="none" stroke="#a58bff33"/>
<circle r="70" fill="none" stroke="#a58bff55"/>
<circle r="45" fill="none" stroke="#a58bff66"/>
</g>

